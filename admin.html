<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClutchZone - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Admin Header -->
    <div class="app-header">
        <div class="logo">⚡ ADMIN PANEL</div>
        <div class="header-actions">
            <button class="logout-btn" onclick="window.location.href='index.html'">Back to App</button>
        </div>
    </div>

    <div class="container" style="margin-top: 20px;">
        <!-- Organizer Dashboard -->
        <div class="glass" style="padding: 16px; border: 1px dashed var(--success);">
            <h4 style="color:var(--success); margin-top:0; font-size:14px;">🧑‍💼 ORGANIZER COMMAND CENTER</h4>
            
            <input type="text" id="match-title" class="input-glass" placeholder="Match Title (e.g. Solo Classic)">
            <select id="match-status" class="input-glass" style="background: #12131c; color: #fff;">
                <option value="upcoming">Status: Upcoming</option>
                <option value="live">Status: Live</option>
                <option value="finished">Status: Finished</option>
            </select>
            <input type="text" id="room-id" class="input-glass" placeholder="Room ID">
            <input type="text" id="room-pass" class="input-glass" placeholder="Room Password">
            <input type="number" id="entry-fee" class="input-glass" placeholder="Entry Fee">
            <button onclick="createTournament()" class="btn-primary" style="background:var(--success); color:#fff; margin-bottom:15px;">Launch Tournament</button>

            <hr style="border-color:var(--border); margin:15px 0;">
            <h5 style="color:var(--primary); margin:5px 0; font-size:13px;">⚡ INSTANT KILL & PRIZE PAYOUT</h5>
            <input type="text" id="p-ffuid" class="input-glass" placeholder="Player Free Fire UID">
            <input type="number" id="p-prize" class="input-glass" placeholder="Prize Amount (₹)">
            <input type="number" id="p-kills" class="input-glass" placeholder="Kills Scored">
            <button onclick="processInstantPayout()" class="btn-primary" style="background:linear-gradient(135deg, #007bff, #0056b3);">Credit Instantly</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Main Logic Script (Same script file use hoga) -->
    <script src="script.js"></script>
</body>
</html>
