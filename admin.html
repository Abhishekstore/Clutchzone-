<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClutchZone - Admin & Organizer Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 15px; }
        .admin-container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h2 { text-align: center; color: #f97316; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
        input, select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; outline: none; transition: border 0.2s; }
        input:focus, select:focus { border-color: #f97316; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #f97316, #ea580c); color: white; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: opacity 0.2s; }
        .btn-submit:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>⚡ Create Tournament Panel</h2>
        
        <div class="form-group">
            <label>Tournament Title</label>
            <input type="text" id="tournament-title" placeholder="e.g., Daily Custom War #1">
        </div>

        <div class="row">
            <div class="form-group">
                <label>Game Category</label>
                <select id="tournament-category" onchange="updateSubModes()">
                    <option value="Full Map">Full Map (Max 48)</option>
                    <option value="Survival">Survival (Max 48)</option>
                    <option value="Clash Squad">Clash Squad</option>
                    <option value="Lone Wolf">Lone Wolf</option>
                </select>
            </div>
            <div class="form-group">
                <label>Sub-Mode / Format</label>
                <select id="tournament-submode">
                    <!-- Dynamic Options -->
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Entry Fee (₹)</label>
                <input type="number" id="tournament-entry" placeholder="0">
            </div>
            <div class="form-group">
                <label>Prize Pool (₹)</label>
                <input type="number" id="tournament-prize" placeholder="3000">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Per Kill (₹)</label>
                <input type="number" id="tournament-perkill" placeholder="5">
            </div>
            <div class="form-group">
                <label>Start Date & Time</label>
                <input type="datetime-local" id="tournament-time">
            </div>
        </div>

        <button class="btn-submit" onclick="createTournament()">🚀 Launch Tournament</button>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="admin.js"></script>
</body>
</html>
