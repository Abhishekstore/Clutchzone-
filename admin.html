<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Tournament Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 20px; }
        .admin-container { max-width: 500px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 14px; box-sizing: border-box; }
        .btn-admin { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; }
        .btn-admin:hover { background: #1d4ed8; }
        .divider { margin: 30px 0; border: 0; border-top: 1px solid #334155; }
    </style>
</head>
<body>

<div class="admin-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin:0;"><i class="fa-solid fa-shield-halved"></i> Admin Control</h3>
        <a href="index.html" style="color: #38bdf8; text-decoration: none; font-size: 14px;">Back to App</a>
    </div>

    <!-- 1. LAUNCH TOURNAMENT -->
    <h2>⚡ Launch Tournament</h2>
    <div class="form-group">
        <label>Match Title</label>
        <input type="text" id="admin-title" placeholder="e.g. Full Map Solo Custom">
    </div>
    <div class="form-group">
        <label>Status</label>
        <select id="admin-status">
            <option value="Upcoming">Upcoming</option>
            <option value="Ongoing">Ongoing</option>
            <option value="Finished">Finished</option>
        </select>
    </div>
    <div class="form-group">
        <label>Room ID</label>
        <input type="text" id="admin-room-id" placeholder="Enter Room ID">
    </div>
    <div class="form-group">
        <label>Room Password</label>
        <input type="text" id="admin-room-password" placeholder="Enter Password">
    </div>
    <div class="form-group">
        <label>Entry Fee (₹)</label>
        <input type="number" id="admin-entry-fee" placeholder="0 for Free">
    </div>
    <div class="form-group">
        <label>Match Start Date & Time</label>
        <input type="datetime-local" id="admin-match-time">
    </div>
    <button class="btn-admin" id="launch-tournament-btn">Launch Tournament</button>

    <hr class="divider">

    <!-- 2. INSTANT PRIZE / KILL PAYOUT -->
    <h2>🎯 Instant Payout / Credits</h2>
    <div class="form-group">
        <label>Player Free Fire UID</label>
        <input type="text" id="admin-ffuid" placeholder="Enter User FF UID">
    </div>
    <div class="form-group">
        <label>Prize / Winning Amount (₹)</label>
        <input type="number" id="admin-prize" placeholder="Amount to add in wallet">
    </div>
    <div class="form-group">
        <label>Kills Scored</label>
        <input type="number" id="admin-kills" placeholder="Total kills">
    </div>
    <button class="btn-admin" style="background: #16a34a;" id="credit-instantly-btn">Credit Instantly</button>
</div>

<!-- Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="admin.js"></script>
</body>
</html>
