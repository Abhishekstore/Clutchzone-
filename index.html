<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClutchZone Test</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body style="background:#111; color:#fff; padding:20px; font-family:sans-serif;">
    <h2>Firebase Debug Mode</h2>
    <input type="email" id="email" placeholder="Email" style="display:block; width:100%; padding:10px; margin:10px 0;"><br>
    <input type="password" id="password" placeholder="Password" style="display:block; width:100%; padding:10px; margin:10px 0;"><br>
    <button onclick="testLogin()" style="padding:10px 20px; background:orange; font-weight:bold;">Test Login</button>
    <button onclick="testSignup()" style="padding:10px 20px; background:green; color:#fff; font-weight:bold;">Test Signup</button>

    <script>
        alert("1. Script load ho gaya!");

        const firebaseConfig = {
            apiKey: "AIzaSyA1jgyhtyv0fGNicgciT-JjUunyv3zVLJ8",
            authDomain: "ff-tournaments-af47a.firebaseapp.com",
            projectId: "ff-tournaments-af47a",
            storageBucket: "ff-tournaments-af47a.firebasestorage.app",
            messagingSenderId: "238745686365",
            appId: "1:238745686365:web:83e96d5e1dd450dbe2d8b4"
        };

        try {
            firebase.initializeApp(firebaseConfig);
            alert("2. Firebase successfully initialize ho gaya!");
        } catch (error) {
            alert("❌ Firebase Init Error: " + error.message);
        }

        const auth = firebase.auth();

        function testLogin() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            alert("Login button dabaya, email: " + e);
            
            auth.signInWithEmailAndPassword(e, p)
                .then(() => alert("✅ Login Successful!"))
                .catch(err => alert("❌ Login Error: " + err.message));
        }

        function testSignup() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            alert("Signup button dabaya, email: " + e);

            auth.createUserWithEmailAndPassword(e, p)
                .then(() => alert("✅ Signup Successful!"))
                .catch(err => alert("❌ Signup Error: " + err.message));
        }
    </script>
</body>
</html>
